
name: Weekly Trending Repos

on:
  workflow_dispatch: # 开启手动点击运行按钮
  schedule:
    - cron: '0 0 * * 1' # 每周一 UTC 00:00 (北京时间早上 8:00) 自动运行

permissions:
  contents: write

jobs:
  scrape-and-summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Fetch Script
        run: |
          python -c "
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime

          url = 'https://github.com/trending?since=weekly'
          headers = {'User-Agent': 'Mozilla/5.0'}
          resp = requests.get(url, headers=headers)
          soup = BeautifulSoup(resp.text, 'html.parser')
          articles = soup.find_all('article', class_='Box-row')[:10]

          report = ['# 🚀 本周热门 GitHub 项目 Top 10\n', f'> 更新时间：{datetime.now().strftime(\"%Y-%m-%d\")}\n']
          for idx, item in enumerate(articles, 1):
              title_tag = item.find('h2').find('a')
              repo_path = title_tag.get('href').strip().lstrip('/')
              repo_link = f'https://github.com/{repo_path}'
              desc_tag = item.find('p')
              desc = desc_tag.text.strip() if desc_tag else '无描述'
              report.append(f'### {idx}. [{repo_path}]({repo_link})\n- 简介：{desc}\n')

          with open('TRENDING_WEEKLY.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(report))
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add TRENDING_WEEKLY.md
          git commit -m "Auto-update weekly trending repos" || echo "No changes"
          git push
